# Server config
server.port=8080
spring.application.name=MuziekDetective

# Thymeleaf config
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Logging
logging.level.com.lucasfenstra.muziekdetective=DEBUG
# Rate limiting op /analyze
muziekdetective.ratelimit.max-requests=5
muziekdetective.ratelimit.window=10m
# Alleen achter een vertrouwde reverse proxy (Railway) op true: dan wordt het laatste
# X-Forwarded-For-item als client-IP gebruikt. Gezet in de Dockerfile.
muziekdetective.trust-proxy=${TRUST_PROXY:false}
